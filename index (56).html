  <div id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" sc-camel-view-box="0 0 100 100"><rect width="100" height="100" fill="#1e2630"></rect><circle cx="50" cy="50" r="30" fill="#1e96f0"></circle><text x="50" y="58" font-family="sans-serif" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">XC</text></svg></div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // Done on elements: cutting the markup text could rejoin a split closing tag.
    const stripPins = (root) => {
      for (const el of root.querySelectorAll('[integrity], [crossorigin], template')) {
        el.removeAttribute('integrity');
        el.removeAttribute('crossorigin');
        if (el.localName === 'template' && el.content) stripPins(el.content);
      }
    };
    stripPins(doc);
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

-weight:800;font-size:15px;\">{{ o.qty }} títulos · {{ o.total }}<\u002Fspan>\n                <span style=\"font-size:12px;color:#9aa6b2;font-family:Montserrat,sans-serif;font-variant-numeric:tabular-nums;\">{{ o.id }} · {{ o.date }}<\u002Fspan>\n              <\u002Fdiv>\n              <span style=\"font-size:12px;font-weight:800;padding:5px 9px;border-radius:8px;background:{{ o.stBg }};color:{{ o.stFg }};\">{{ o.status }}<\u002Fspan>\n            <\u002Fdiv>\n            <sc-if value=\"{{ o.isPaid }}\">\n              <div style=\"display:flex;flex-wrap:wrap;gap:5px;max-height:220px;overflow:auto;\">\n                <sc-for list=\"{{ o.chips }}\" as=\"ch\">\n                  <span style=\"font-family:Montserrat,sans-serif;font-variant-numeric:tabular-nums;font-size:12px;font-weight:700;padding:4px 7px;border-radius:6px;background:{{ ch.bg }};color:{{ ch.fg }};\">{{ ch.n }}<\u002Fspan>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ o.isPending }}\">\n              <button sc-camel-on-click=\"{{ o.onPay }}\" style=\"transition:transform .18s ease,filter .18s ease,background-color .18s ease,border-color .18s ease,box-shadow .18s ease;border:none;border-radius:14px;padding:12px;background:linear-gradient(180deg,oklch(0.7 0.17 240),oklch(0.58 0.19 252));box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 22px oklch(0.6 0.19 248 / .35);color:#ffffff;font-weight:800;cursor:pointer;\" style-hover=\"transform:translateY(-2px);filter:brightness(1.06) saturate(1.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 12px 28px oklch(0.6 0.19 248 / .5);\" style-active=\"transform:scale(.96);filter:brightness(.95);\">Pagar agora<\u002Fbutton>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isRoleta }}\">\n      <section style=\"display:flex;flex-direction:column;gap:16px;\">\n        <div style=\"display:flex;flex-dir n                <button sc-camel-on-click=\"{{ copySlug }}\" style=\"border:1px solid #3d4a58;background:transparent;color:#f2f5f7;border-radius:12px;padding:8px 12px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;transition:transform .18s ease,border-color .18s ease;\" style-hover=\"transform:translateY(-2px);border-color:oklch(0.72 0.17 240);\">Copiar link<\u002Fbutton>\n              <\u002Fdiv>\n              <span style=\"font-weight:500;color:#7a8692;\">Só letras minúsculas, números e hífen. Clique em Salvar para ativar.<\u002Fspan>\n            <\u002Fdiv>\n            <label style=\"display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;color:#9aa6b2;\">Título<input value=\"{{ c.title }}\" sc-camel-on-change=\"{{ f.title }}\" style=\"transition:border-color .18s ease,box-shadow .18s ease;background:#1e2630;border:1px solid #3d4a58;border-radius:10px;padding:11px 12px;color:#f2f5f7;font-size:14px;outline:none;\" style-focus=\"border-color:oklch(0.72 0.17 240);box-shadow:0 0 0 3px oklch(0.8 0.15 75 / .18);\"><\u002Flabel>\n            <label style=\"display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;color:#9aa6b2;\">Descrição<textarea value=\"{{ c.desc }}\" sc-camel-on-change=\"{{ f.desc }}\" rows=\"3\" style=\"transition:border-color .18s ease,box-shadow .18s ease;background:#1e2630;border:1px solid #3d4a58;border-radius:10px;padding:11px 12px;color:#f2f5f7;font-size:14px;outline:none;resize:vertical;\" style-focus=\"border-color:oklch(0.72 0.17 240);box-shadow:0 0 0 3px oklch(0.8 0.15 75 / .18);\"><\u002Ftextarea><\u002Flabel>\n            <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;\">\n              <label style=\"display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;color:#9aa6b2;\">Valor de cada cota (R$)<input value=\"{{ c.price }}\" sc-camel-on-change=\"{{ f.price }}\" sc-camel-input-mode=\"decimal\" style=\"transition:border-color .18s ease,box-shadow .18s ease;background:#1e2630;border:1px solid #3d4a58;border-radius:10px;padding:11px 12px;color:#f2f5f7;font-size:14px;outline:none;\" style-focus=\"border-color:oklch(0.72 0.17 240);box-shadow:0 0 0 3px oklch(0.8 0.15 75 / .18);\"><\u002Flabel>\n              <label style=\"display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;color:#9aa6b2;\">Total de cotas (vagas)<input value=\"{{ c.total }}\" sc-camel-on-change=\"{{ f.total }}\" sc-camel-input-mode=\"numeric\" style=\"transition:border-color .18s ease,box-shadow .18s ease;background:#1e2630;border:1px solid #3d4a58;border-radius:10px;padding:11px 12px;color:#f2f5f7;font-size:14px;outline:none;\" style-focus=\"border-color:oklch(0.72 0.17 240);box-shadow:0 0 0 3px oklch(0.8 0.15 75 / .18);\"><\u002Flabel>\n              <label style=\"display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;color:#9aa6b2;\">Compra mínima<input value=\"{{ c.minQty }}\" sc-camel-on-change=\"{{ f.minQty }}\" sc-camel-input-mode=\"numeric\" style=\"transition:border-color .18s ease,box-shadow .18s ease;background:#1e2630;border:1px solid #3d4a58;border-radius:10px;padding:11px 12px;color:#f2f5f7;font-size:14px;outline:none;\" style-focus=\"border-color:oklch(0.72 0.17 240);box-shadow:0 0 0 3px oklch(0.8 0.15 75 / .18);\"><\u002Flabel>\n              <label style=\"display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;color:#9aa6b2;\">1 giro a cada X títulos<input value=\"{{ c.spinsEvery }}\" sc-camel-on-change=\"{{ f.spinsEvery }}\" sc-camel-input-mode=\"numeric\" style=\"transition:border-color .18s ease,box-shadow .18s ease;background:#1e2630;border:1px solid #3d4a58;border-radius:10px;padding:11px 12px;color:#f2f5f7;font-size:14px;outline:none;\" style-focus=\"border-color:oklch(0.72 0.17 240);box-shadow:0 0 0 3px oklch(0.8 0.15 75 / .18);\"><\u002Flabel>\n            <\u002Fdiv>\n            <div style=\"background:#1e2630;border:1px solid #34404d;border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:13px;line-height:1.5;color:#c9d1d9;\">\n              <span style=\"font-weight:700;color:#f2f5f7;\">Encerramento automático<\u002Fspan>\n              <span>A campanha só encerra quando todas as cotas forem vendidas. Vendidas: {{ soldLabel }} de {{ totalLabelAdm }}.<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"background:#1e2630;border:1px solid #34404d;border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:13px;line-height:1.5;color:#c9d1d9;\">\n              <span style=\"font-weight:700;color:#f2f5f7;\">Como funcionam os números<\u002Fspan>\n              <span>{{ numHelp }}<\u002Fspan>\n            <\u002Fdiv>\n            <label style=\"display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;color:#9aa6b2;\">Forma de sorteio<input value=\"{{ c.drawInfo }}\" sc-camel-on-change=\"{{ f.drawInfo }}\" style=\"transition:border-color .18s ease,box-shadow .18s ease;background:#1e2630;border:1px solid #3d4a58;border-radius:10px;padding:11px 12px;color:#f2f5f7;font-size:14px;outline:none;\" style-focus=\"border-color:oklch(0.72 0.17 240);box-shadow:0 0 0 3px oklch(0.8 0.15 75 / .18);\"><\u002Flabel>\n            <div style=\"display:flex;flex-direction:column;gap:8px;\">\n              <span style=\"font-size:12px;font-weight:700;color:#9aa6b2;\">Fotos da ação · a primeira é a capa<\u002Fspan>\n              <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;\">\n                <sc-for list=\"{{ adminImgs }}\" as=\"im\">\n                  <div style=\"position:relative;aspect-ratio:1/1;border-radius:12px;overflow:hidden;background:#1e2630;border:1px solid {{ im.border }};\">\n                    <img src=\"{{ im.src }}\" alt=\"Foto\" loading=\"lazy\" decoding=\"async\" style=\"width:100%;height:100%;object-fit:cover;display:block;\">\n                    <sc-if value=\"{{ im.isCover }}\"><span style=\"position:absolute;left:6px;top:6px;background:oklch(0.72 0.17 240);color:#fff;font-size:10px;font-weight:800;border-radius:6px;padding:2px 6px;\">Capa<\u002Fspan><\u002Fsc-if>\n                    <div style=\"position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;padding:6px;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.6));\">\n                      <button sc-camel-on-click=\"{{ im.onLeft }}\" aria-label=\"Mover para a esquerda\" style=\"width:28px;height:28px;border:none;border-radius:8px;background:rgba(15,20,25,.8);color:#fff;font-size:14px;cursor:pointer;\">‹<\u002Fbutton>\n                      <button sc-camel-on-click=\"{{ im.onRemove }}\" aria-label=\"Remover foto\" style=\"width:28px;height:28px;border:none;border-radius:8px;background:rgba(15,20,25,.8);color:#fff;font-size:12px;cursor:pointer;\">✕<\u002Fbutton>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n                <label style=\"aspect-ratio:1/1;border:2px dashed #3d4a58;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;padding:6px;cursor:pointer;color:#c9d1d9;font-size:12px;font-weight:700;transition:border-color .18s ease,background-color .18s ease;\" style-hover=\"border-color:oklch(0.72 0.17 240);background-color:#26303b;\">\n                  <span style=\"font-size:24px;line-height:1;color:oklch(0.72 0.17 240);\">+<\u002Fspan>\n                  <span>{{ uploadLabel }}<\u002Fspan>\n                  <input type=\"file\" accept=\"image/*\" multiple=\"{{ true }}\" sc-camel-on-change=\"{{ onPickImages }}\" style=\"display:none;\">\n                <\u002Flabel>\n              <\u002Fdiv>\n              <span style=\"font-size:12px;color:#7a8692;\">Do celular abre a galeria ou a câmera; do notebook, escolha os arquivos. As fotos vão para a pasta /fotos do GitHub. Depois clique em Salvar.<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:16px;\">\n            <div style=\"background:#26303b;border:1px solid #34404d;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;\">\n              <span style=\"font-size:13px;font-weight:800;text-transform:uppercase;color:#9aa6b2;\">Combos promocionais<\u002Fspan>\n              <sc-for list=\"{{ comboRows }}\" as=\"r\">\n                <div style=\"display:flex;gap:8px;align-items:center;\">\n                  <input value=\"{{ r.qty }}\" sc-camel-on-change=\"{{ r.onQty }}\" placeholder=\"Qtd\" style=\"transition:border-color .18s ease,box-shadow .18s ease;flex:1;min-width:0;background:#1e2630;border:1px solid #3d4a58;border-radius:10px;padding:10px;color:#f2f5f7;font-size:14px;outline:none;\" style-focus=\"border-color:oklch(0.72 0.17 240);box-shadow:0 0 0 3px oklch(0.8 0.15 75 / .18);\">\n                  <span style=\"color:#9aa6b2;font-size:13px;\">por R$<\u002Fspan>\n                  <input value=\"{{ r.price }}\" sc-camel-on-change=\"{{ r.onPrice }}\" placeholder=\"Valor\" style=\"transition:border-color .18s ease,box-shadow .18s ease;flex:1;min-width:0;background:#1e2630;border:1px solid #3d4a58;border-radius:10px;padding:10px;color:#f2f5f7;font-size:14px;outline:none;\" style-focus=\"border-color:oklch(0.72 0.17 240);box-shadow:0 0 0 3px oklch(0.8 0.15 75 / .18);\">\n                  <button sc-camel-on-click=\"{{ r.onRemove }}\" style=\"transition:transform .18s ease,filter .18s ease,background-color .18s ease,border-color .18s ease,box-shadow .18s ease;border:1px solid #3d4a58;background:transparent;color:#9aa6b2;border-radius:14px;width:40px;height:40px;flex:none;cursor:pointer;\" style-hover=\"transform:translateY(-2px);filter:brightness(1.08);border-color:oklch(0.72 0.17 240);box-shadow:0 8px 20px rgba(0,0,0,.35);\" style-active=\"transform:scale(.96);filter:brightness(.95);\">✕<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <button sc-camel-on-click=\"{{ addCombo }}\" style=\"transition:transform .18s ease,filter .18s ease,background-color .18s ease,border-color .18s ease,box-shadow .18s ease;border:1px dashed #3d4a58;background:transparent;color:#f2f5f7;border-radius:14px;padding:10px;font-weight:700;cursor:pointer;\" style-hover=\"transform:translateY(-2px);filter:brightness(1.08);border-color:oklch(0.72 0.17 240);box-shadow:0 8px 20px rgba(0,0,0,.35);\" style-active=\"transform:scale(.96);filter:brightness(.95);\">+ Adicionar combo<\u002Fbutton>\n              <label style=\"display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:700;color:#9aa6b2;\">Botões rápidos (separados por vírgula)<input value=\"{{ c.quickRaw }}\" sc-camel-on-change=\"{{ f.quickRaw }}\" style=\"transition:border-color .18s ease,box-shadow .18s ease;background:#1e2630;border:1px solid #3d4a58;border-radius:10px;padding:11px 12px;color:#f2f5f7;font-size:14px;outline:none;\" style-focus=\"border-color:oklch(0.72 0.17 240);box-shadow:0 0 0 3px oklch(0.8 0.15 75 / .18);\"><\u002Flabel>\n            <\u002Fdiv>\n            <div style=\"background:#26303b;border:1px solid #34404d;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;\">\n              <span style=\"font-size:13px;font-weight:800;text-transform:uppercase;color:#9aa6b2;\">Desconto progressivo<\u002Fspan>\n              <span style=\"font-size:12px;color:#7a8692;line-height:1.5;\">O valor de cada cota cai conforme a quantidade. Ex.: a partir de 100 cotas, R$ 0,80 cada. Abaixo da primeira faixa vale o valor normal da cota.<\u002Fspan>\n              <sc-for list=\"{{ tierRows }}\" as=\"r\">\n                <div style=\"display:flex;gap:8px;align-items:center;flex-wrap:wrap;\">\n                  <span style=\"color:#9aa6b2;font-size:13px;\">A partir de<\u002Fspan>\n                  <input value=\"{{ r.from }}\" sc-camel-on-change=\"{{ r.onFrom }}\" placeholder=\"Qtd\" sc-camel-input-mode=\"numeric\" style=\"flex:1;min-width:70px;background:#1e2630;border:1px solid #3d4a58;border-radius:10px;padding:10px;color:#f2f5f7;font-size:14px;outline:none;\" style-focus=\"border-color:oklch(0.72 0.17 240);\">\n                  <span style=\"color:#9aa6b2;font-size:13px;\">cotas, R$<\u002Fspan>\n                  <input value=\"{{ r.price }}\" sc-camel-on-change=\"{{ r.onPrice }}\" placeholder=\"0,80\" sc-camel-input-mode=\"decimal\" style=\"flex:1;min-width:70px;background:#1e2630;border:1px solid #3d4a58;border-radius:10px;padding:10px;color:#f2f5f7;font-size:14px;outline:none;\" style-focus=\"border-color:oklch(0.72 0.17 240);\">\n                  <span style=\"color:#9aa6b2;font-size:13px;\">cada<\u002Fspan>\n                  <button sc-camel-on-click=\"{{ r.onRemove }}\" aria-label=\"Remover\" style=\"border:1px solid #3d4a58;background:transparent;color:#9aa6b2;border-radius:14px;width:40px;height:40px;flex:none;cursor:pointer;\" style-hover=\"border-color:oklch(0.72 0.17 240);\">✕<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n              <button sc-camel-on-click=\"{{ addTier }}\" style=\"border:1px dashed #3d4a58;background:transparent;color:#f2f5f7;border-radius:14px;padding:10px;font-weight:700;cursor:pointer;transition:transform .18s ease,border-color .18s ease;\" style-hover=\"transform:translateY(-2px);border-color:oklch(0.72 0.17 240);\">+ Adicionar faixa de preço<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"background:#26303b;border:1px solid #34404d;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;\">\n              <span style=\"font-size:13px;font-weight:800;text-transform:uppercase;color:#9aa6b2;\">Ranking ao vivo<\u002Fspan>\n              <label style=\"display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;\"><input type=\"checkbox\" checked=\"{{ c.rankingOn }}\" sc-camel-on-change=\"{{ setRankingOn }}\" style=\"width:18px;height:18px;accent-color:oklch(0.72 0.17 240);\">Mostrar ranking na campanha<\u002Flabel>\n              <sc-raw-select value=\"{{ c.rankingMode }}\" sc-camel-on-change=\"{{ f.rankingMode }}\" style=\"transition:border-color .18s ease,box-shadow .18s ease;background:#1e2630;border:1px solid #3d4a58;border-radius:10px;padding:11px 12px;color:#f2f5f7;font-size:14px;outline:none;\" style-focus=\"border-color:oklch(0.72 0.17 240);box-shadow:0 0 0 3px oklch(0.8 0.15 75 / .18);\"><option value=\"menor\">Menor título<\u002Foption><option value=\"maior\">Maior título<\u002Foption><\u002Fsc-raw-select>\n              <input value=\"{{ c.rankingText }}\" sc-camel-on-change=\"{{ f.rankingText }}\" placeholder=\"Texto do prêmio\" style=\"transition:border-color .18s ease,box-shadow .18s ease;background:#1e2630;border:1px solid #3d4a58;border-radius:10px;padding:11px 12px;color:#f2f5f7;font-size:14px;outline:none;\" style-focus=\"border-color:oklch(0.72 0.17 240);box-shadow:0 0 0 3px oklch(0.8 0.15 75 / .18);\">\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ tCotas }}\">\n        <div style=\"background:#26303b;border:1px solid #34404d;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;\">\n          <span style=\"font-size:13px;font-weight:800;text-transform:uppercase;color:#9aa6b2;\">Nova cota premiada<\u002Fspan>\n          <div style=\"display:flex;gap:8px;flex-wrap:wrap;\">\n            <input value=\"{{ newPN.number }}\" sc-camel-on-change=\"{{ setPNNumber }}\" placeholder=\"Número\" sc-camel-input-mode=\"numeric\" style=\"transition:border-color .18s ease,box-shadow .18s ease;flex:1 1 110px;background:#1e2630;border:1px solid #3d4a58;border-radius:10px;padding:11px 12px;color:#f2f5f7;font-size:14px;font-family:Montserrat,sans-serif;font-variant-numeric:tabular-nums;outline:none;\" style-focus=\"border-color:oklch(0.72 0.17 240);box-shadow:0 0 0 3px oklch(0.8 0.15 75 / .18);\"
